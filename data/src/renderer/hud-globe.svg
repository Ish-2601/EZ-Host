    <circle cx="560" cy="330" r="30" fill="url(#hot)"/>
    <circle cx="470" cy="560" r="24" fill="url(#hot)"/>
    <circle cx="250" cy="470" r="5" fill="#ff7a1a"/>
    <circle cx="560" cy="330" r="5" fill="#ffffff"/>
    <circle cx="470" cy="560" r="4" fill="#ff7a1a"/>
    <circle cx="330" cy="250" r="3" fill="#ff3d3d"/>
    <circle cx="610" cy="470" r="3" fill="#ff3d3d"/>
