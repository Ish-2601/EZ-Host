<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Background art for the HUD theme: a dot-grid wireframe globe with link arcs. Original artwork. -->
  <defs>
    <clipPath id="g"><circle cx="400" cy="400" r="320"/></clipPath>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="#d7dbe0">
    <circle cx="400" cy="400" r="320" stroke-width="1.5"/>
    <circle cx="400" cy="400" r="352" stroke-width="1" stroke-dasharray="2 10"/>
    <g clip-path="url(#g)" stroke-width="1.2" stroke-dasharray="1.5 7" stroke-linecap="round">
      <ellipse cx="400" cy="400" rx="60" ry="320"/>
      <ellipse cx="400" cy="400" rx="130" ry="320"/>
      <ellipse cx="400" cy="400" rx="200" ry="320"/>
      <ellipse cx="400" cy="400" rx="265" ry="320"/>
      <path d="M400 80v640"/>
      <ellipse cx="400" cy="400" rx="320" ry="40"/>
      <ellipse cx="400" cy="400" rx="320" ry="120"/>
      <ellipse cx="400" cy="400" rx="320" ry="200"/>
      <ellipse cx="400" cy="400" rx="320" ry="270"/>
